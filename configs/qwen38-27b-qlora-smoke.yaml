# StoryForge Qwen3.8-27B QLoRA smoke test
# Purpose: verify model loading, dataset parsing, forward/backward pass,
# checkpoint writing, and adapter reload. This is NOT the final training config.

model: Qwen/Qwen3.8-27B
use_hf: true

tuner_type: lora
target_modules: all-linear
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05

dataset:
  - data/compiled/v0.3/train.jsonl
val_dataset:
  - data/compiled/v0.3/validation.jsonl

torch_dtype: bfloat16
quant_method: bnb
quant_bits: 4
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true

max_length: 16384
loss_scale: last_round
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4

learning_rate: 0.0001
warmup_ratio: 0.05
max_steps: 3

logging_steps: 1
eval_steps: 3
save_steps: 3
save_total_limit: 1

gradient_checkpointing: true
dataloader_num_workers: 2
dataset_num_proc: 2

output_dir: output/qwen38-27b-storyforge-smoke
