# StoryForge R46 exploratory 49/15 QLoRA; dataset paths overridden by runtime.
model: Qwen/Qwen3.8-27B
use_hf: true
tuner_type: lora
target_modules: all-linear
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
dataset:
  - /workspace/preflight/v02-r46/OVERRIDE_AT_RUNTIME_train.jsonl
val_dataset:
  - /workspace/preflight/v02-r46/OVERRIDE_AT_RUNTIME_validation.jsonl
torch_dtype: bfloat16
quant_method: bnb
quant_bits: 4
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
max_length: 16384
loss_scale: last_round
disable_ignore_empty_think: true
add_non_thinking_prefix: false
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.00005
num_train_epochs: 1
warmup_ratio: 0.05
logging_steps: 1
eval_strategy: steps
save_strategy: steps
eval_steps: 3
save_steps: 3
save_total_limit: 2
gradient_checkpointing: true
dataloader_num_workers: 2
dataset_num_proc: 2
output_dir: /workspace/experiments/v02-r46/OVERRIDE_AT_RUNTIME
