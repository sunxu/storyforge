# StoryForge R54: R54 V2: one epoch, expected ~16 optimizer updates; NO GPU authorization.
# Runtime MUST override placeholder paths with exact, verified PRIVATE release files.
model: Qwen/Qwen3.8-27B
use_hf: true
tuner_type: lora
target_modules: all-linear
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
dataset:
  - /workspace/experiments/v03-r54/REPLACE_WITH_VERIFIED_PRIVATE_TRAIN.jsonl
val_dataset:
  - /workspace/experiments/v03-r54/REPLACE_WITH_VERIFIED_PRIVATE_VALIDATION.jsonl
torch_dtype: bfloat16
quant_method: bnb
quant_bits: 4
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
max_length: 16384
loss_scale: last_round
disable_ignore_empty_think: true
add_non_thinking_prefix: false
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 0.00005
num_train_epochs: 1
warmup_ratio: 0.05
logging_steps: 1
# Deliberate change from R46: eval every 4 optimizer updates, checkpoint every 8.
# An actual LAST-STEP adapter checkpoint and reload are mandatory, not implied by save_steps.
eval_strategy: steps
save_strategy: steps
eval_steps: 4
save_steps: 8
save_total_limit: 3
load_best_model_at_end: false
gradient_checkpointing: true
dataloader_num_workers: 2
dataset_num_proc: 2
output_dir: /workspace/experiments/v03-r54/REPLACE_WITH_UNIQUE_RUN_KEY
