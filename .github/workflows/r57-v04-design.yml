name: R57 V04 admission design (CPU only)

on:
  push:
    branches: ['r57/v03b-data-design']
    paths:
      - '.github/workflows/r57-v04-design.yml'
      - 'docs/plans/R57_V03B_EXPERIMENT_CONTRACT.md'
      - 'docs/evidence/R57_DATA_SOURCE_INVENTORY_SAFE.json'
      - 'docs/R57_V04_DATA_ADMISSION_OWNER_CN.md'
      - 'evaluations/v0.3/r57/R57_DATASET_V04_ADMISSION_SCHEMA.json'
      - 'scripts/r57_v04_admission_gate.py'
      - 'tests/test_r57_v04_admission_gate.py'
      - 'tests/test_r57_v04_output_guard.py'
      - 'scripts/r57_training_lineage_audit.py'
      - 'tests/test_r57_training_lineage_audit.py'
      - 'docs/R57_G2_LINEAGE_CPU_OWNER_CN.md'
      - 'docs/R57_G2_SOURCE_INDEX_EXPORT_OWNER_CN.md'
      - 'docs/evidence/R57_G2_SOURCE_INDEX_TOOLING_SAFE_RECEIPT_20261026.md'
      - 'docs/evidence/R57_G2_FOUR_GIT_BLOBS_SOURCE_CROSSCHECK_SAFE_20261026.md'
      - 'docs/evidence/R57_G2_G3_GOLD195_METADATA_PRESCREEN_SAFE_20261026.json'
      - 'tests/test_r57_gold195_safe_prescreen.py'
      - 'scripts/r57_source_index_export.py'
      - 'tests/test_r57_source_index_export.py'
      - 'scripts/r57_trainer_exact_replay.py'
      - 'tests/test_r57_trainer_exact_replay.py'
      - 'scripts/r57_gold195_g3_prescreen.py'
      - 'tests/test_r57_gold195_g3_prescreen.py'
      - 'docs/R57_G3_GOLD195_PRESCREEN_OWNER_CN.md'
      - 'docs/evidence/R57_G3_GOLD195_PRIMARY_PRESCREEN_SAFE_20261026.json'
      - 'docs/R57_G2_EXACT_REPLAY_OWNER_CN.md'
      - 'docs/evidence/R57_G2_FOUR_GIT_BLOB_BYTE_REPLAY_SAFE_20261026.json'
  pull_request:
    paths:
      - '.github/workflows/r57-v04-design.yml'
      - 'docs/plans/R57_V03B_EXPERIMENT_CONTRACT.md'
      - 'docs/evidence/R57_DATA_SOURCE_INVENTORY_SAFE.json'
      - 'docs/R57_V04_DATA_ADMISSION_OWNER_CN.md'
      - 'evaluations/v0.3/r57/R57_DATASET_V04_ADMISSION_SCHEMA.json'
      - 'scripts/r57_v04_admission_gate.py'
      - 'tests/test_r57_v04_admission_gate.py'
      - 'tests/test_r57_v04_output_guard.py'
      - 'scripts/r57_training_lineage_audit.py'
      - 'tests/test_r57_training_lineage_audit.py'
      - 'docs/R57_G2_LINEAGE_CPU_OWNER_CN.md'
      - 'docs/R57_G2_SOURCE_INDEX_EXPORT_OWNER_CN.md'
      - 'docs/evidence/R57_G2_SOURCE_INDEX_TOOLING_SAFE_RECEIPT_20261026.md'
      - 'docs/evidence/R57_G2_FOUR_GIT_BLOBS_SOURCE_CROSSCHECK_SAFE_20261026.md'
      - 'docs/evidence/R57_G2_G3_GOLD195_METADATA_PRESCREEN_SAFE_20261026.json'
      - 'tests/test_r57_gold195_safe_prescreen.py'
      - 'scripts/r57_source_index_export.py'
      - 'tests/test_r57_source_index_export.py'
      - 'scripts/r57_trainer_exact_replay.py'
      - 'tests/test_r57_trainer_exact_replay.py'
      - 'scripts/r57_gold195_g3_prescreen.py'
      - 'tests/test_r57_gold195_g3_prescreen.py'
      - 'docs/R57_G3_GOLD195_PRESCREEN_OWNER_CN.md'
      - 'docs/evidence/R57_G3_GOLD195_PRIMARY_PRESCREEN_SAFE_20261026.json'
      - 'docs/R57_G2_EXACT_REPLAY_OWNER_CN.md'
      - 'docs/evidence/R57_G2_FOUR_GIT_BLOB_BYTE_REPLAY_SAFE_20261026.json'

permissions:
  contents: read

jobs:
  admission-synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: R57 G1-G2 private-admission and source-lineage synthetic regression
        run: python3 -m unittest discover -s tests -p 'test_r57_*.py' -v
      - name: Verify four real Git blobs byte pins and exact SHA target overlaps (no private input)
        run: |
          python3 scripts/r57_trainer_exact_replay.py --repo-root . --mode draft > "${RUNNER_TEMP}/r57_four_source_safe.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'r57_four_source_safe.json').read_text())
          expected = {"GOLD87": 87, "GOLD108": 108, "V01_TRAIN": 65, "V01_VALIDATION": 15}
          assert data['source_row_counts'] == expected
          assert data['original_file_byte_pins_checked_by_cli'] is True
          assert data['gold_distinct_target_count'] == 195
          assert all(p['target_exact'] == 0 for p in data['exact_pairwise'])
          assert all(p['role_content_full_exact'] == 0 for p in data['exact_pairwise'])
          assert all(p['role_content_history_exact'] == 0 for p in data['exact_pairwise'])
          assert data['source_metadata_coverage']['GOLD108']['declared_target_hashes_verified'] == 108
          assert data['source_metadata_coverage']['GOLD87']['declared_target_hashes_verified'] == 87
          assert data['v04_admitted'] == 0 and data['protected_evaluation_accessed'] is False
          assert data['true_world_component_isolation_verified'] is False
          print('R57_G2_FOUR_GIT_BLOBS_BYTE_PIN_AND_EXACT_TARGET_PASS__FULL_EIGHT_SOURCE_HOLD')
          PY
      - name: G3 prescreen true Gold195 metadata and UUID exposure, no admission
        run: |
          python3 scripts/r57_gold195_g3_prescreen.py --repo-root . > "${RUNNER_TEMP}/r57_g3_prescreen_safe.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          r = json.loads((Path(os.environ['RUNNER_TEMP']) / 'r57_g3_prescreen_safe.json').read_text())
          assert r['source_file_byte_pins_checked_by_cli'] is True
          assert r['gold195_distinct_exact_targets'] == 195
          assert r['gold195_distinct_world_uuids'] == 13
          assert r['source_rows'] == {
              'GOLD87': 87, 'GOLD108': 108, 'V01_TRAIN': 65, 'V01_VALIDATION': 15
          }
          assert r['gold195_source_sha_field_present'] == 188
          assert r['gold195_source_sha_field_absent'] == 7
          assert r['per_pool']['GOLD87']['same_uuid_as_v01_train_rows'] == 21
          assert r['per_pool']['GOLD108']['same_uuid_as_v01_train_rows'] == 0
          assert r['gold_exact_target_seen_in_v01'] == {'train': 0, 'validation': 0}
          for gate in ('independent_review', 'qwen_length', 'final_mask', 'target_time_card'):
              assert r['gold195_review_signals'][gate] == {
                  'explicit_pending': 171, 'absent': 24, 'other_unverified': 0
              }
          assert r['v04_admitted_samples'] == 0
          assert r['independent_quality_review_admission_done'] is False
          assert r['cross_uuid_world_alias_graph_certified'] is False
          assert r['protected_evaluation_content_accessed'] is False
          print('R57_G3_ACTUAL_GOLD195_PRESCREEN_COUNTS_PASS__NO_ADMISSION')
          PY
      - name: Verify count-only source inventory is marked zero-admission
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/evidence/R57_DATA_SOURCE_INVENTORY_SAFE.json')
          r = json.loads(p.read_text(encoding='utf-8'))
          assert r['gold195']['rows'] == 195
          assert sum(p['rows'] for p in r['frozen_source_pools']) == 195
          v = r['dataset_v04']
          assert v['admitted_train'] == v['admitted_validation'] == 0
          assert v['protected_test_body_accessed'] is False
          assert v['training_job_started'] is False
          print('R57_V04_INVENTORY_COUNT_ONLY_PREP_PASS__NO_R50__NO_TRAINING')
          PY
