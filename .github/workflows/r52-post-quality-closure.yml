name: R52 Post-quality Closure (synthetic only)
on:
  push:
    paths:
      - scripts/v03_r52_post_quality_closure.py
      - scripts/v03_r52_no_card_quality_reviews.py
      - tests/test_v03_r52_post_quality_closure.py
      - .github/workflows/r52-post-quality-closure.yml
  pull_request:
    paths:
      - scripts/v03_r52_post_quality_closure.py
      - scripts/v03_r52_no_card_quality_reviews.py
      - tests/test_v03_r52_post_quality_closure.py
      - .github/workflows/r52-post-quality-closure.yml
  workflow_dispatch:

jobs:
  synthetic-closure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify synthetic 62-case closure and tamper rejection
        run: python -m unittest discover -s tests -p 'test_v03_r52_post_quality_closure.py' -v
