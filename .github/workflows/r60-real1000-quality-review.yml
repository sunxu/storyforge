name: R60 REAL1000 Quality Reviewer (synthetic only)

on:
  push:
    branches:
      - r60/common2-cpu2-owner
    paths:
      - "experiments/r58_quality/r60_reviewer_transport.py"
      - "experiments/r58_quality/r60_reviewer_protocol_probe.py"
      - "experiments/r58_quality/r60_real_ai_dual_review.py"
      - "experiments/r58_quality/r60_real_quality_batch.py"
      - "experiments/r58_quality/test_r60_real_ai_dual_review.py"
      - "experiments/r58_quality/test_r60_real_quality_batch.py"
      - "experiments/r58_quality/r60_pilot5_v2_safe_audit.py"
      - "experiments/r58_quality/test_r60_pilot5_v2_safe_audit.py"
      - "experiments/r58_quality/r60_pilot5_v2_replay_plan.py"
      - "experiments/r58_quality/test_r60_pilot5_v2_replay_plan.py"
      - "experiments/r58_quality/r60_pilot5_v2_replay_execute.py"
      - "experiments/r58_quality/test_r60_pilot5_v2_replay_execute.py"
      - "experiments/r58_quality/r60_pilot5_v2_crosswalk.py"
      - "experiments/r58_quality/test_r60_pilot5_v2_crosswalk.py"
      - "src/storyforge_gold_quality/real1000_screening_policy.py"
      - "tests/test_r60_real1000_screening_policy.py"
      - "experiments/r58_quality/r60_real1000_offline_prefilter.py"
      - "experiments/r58_quality/test_r60_real1000_offline_prefilter.py"
      - "experiments/r58_quality/r60_real1000_prefilter_stage_crosswalk.py"
      - "experiments/r58_quality/test_r60_real1000_prefilter_stage_crosswalk.py"
      - "experiments/r58_quality/r60_real1000_deepseek_single.py"
      - "experiments/r58_quality/test_r60_real1000_deepseek_single.py"
      - "experiments/r58_quality/r60_real1000_v1_repair_plan.py"
      - "experiments/r58_quality/test_r60_real1000_v1_repair_plan.py"
      - ".github/workflows/r60-real1000-quality-review.yml"
  pull_request:
    paths:
      - "experiments/r58_quality/r60_reviewer_transport.py"
      - "experiments/r58_quality/r60_reviewer_protocol_probe.py"
      - "experiments/r58_quality/r60_real_ai_dual_review.py"
      - "experiments/r58_quality/r60_real_quality_batch.py"
      - "experiments/r58_quality/test_r60_real_ai_dual_review.py"
      - "experiments/r58_quality/test_r60_real_quality_batch.py"
      - "experiments/r58_quality/r60_pilot5_v2_safe_audit.py"
      - "experiments/r58_quality/test_r60_pilot5_v2_safe_audit.py"
      - "experiments/r58_quality/r60_pilot5_v2_replay_plan.py"
      - "experiments/r58_quality/test_r60_pilot5_v2_replay_plan.py"
      - "experiments/r58_quality/r60_pilot5_v2_replay_execute.py"
      - "experiments/r58_quality/test_r60_pilot5_v2_replay_execute.py"
      - "experiments/r58_quality/r60_pilot5_v2_crosswalk.py"
      - "experiments/r58_quality/test_r60_pilot5_v2_crosswalk.py"
      - "src/storyforge_gold_quality/real1000_screening_policy.py"
      - "tests/test_r60_real1000_screening_policy.py"
      - "experiments/r58_quality/r60_real1000_offline_prefilter.py"
      - "experiments/r58_quality/test_r60_real1000_offline_prefilter.py"
      - "experiments/r58_quality/r60_real1000_prefilter_stage_crosswalk.py"
      - "experiments/r58_quality/test_r60_real1000_prefilter_stage_crosswalk.py"
      - "experiments/r58_quality/r60_real1000_deepseek_single.py"
      - "experiments/r58_quality/test_r60_real1000_deepseek_single.py"
      - "experiments/r58_quality/r60_real1000_v1_repair_plan.py"
      - "experiments/r58_quality/test_r60_real1000_v1_repair_plan.py"
      - ".github/workflows/r60-real1000-quality-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-review-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only local dev/test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint R60 REAL1000 shared reviewer modules
        run: |
          ruff check \
            experiments/r58_quality/r60_reviewer_transport.py \
            experiments/r58_quality/r60_reviewer_protocol_probe.py \
            experiments/r58_quality/r60_real_ai_dual_review.py \
            experiments/r58_quality/r60_real_quality_batch.py \
            experiments/r58_quality/r60_pilot5_v2_safe_audit.py \
            experiments/r58_quality/r60_pilot5_v2_replay_plan.py \
            experiments/r58_quality/r60_pilot5_v2_replay_execute.py \
            experiments/r58_quality/r60_pilot5_v2_crosswalk.py \
            experiments/r58_quality/test_r60_real_ai_dual_review.py \
            experiments/r58_quality/test_r60_real_quality_batch.py \
            experiments/r58_quality/test_r60_pilot5_v2_safe_audit.py \
            experiments/r58_quality/test_r60_pilot5_v2_replay_plan.py \
            experiments/r58_quality/test_r60_pilot5_v2_replay_execute.py \
            experiments/r58_quality/test_r60_pilot5_v2_crosswalk.py \
            src/storyforge_gold_quality/real1000_screening_policy.py \
            tests/test_r60_real1000_screening_policy.py \
            experiments/r58_quality/r60_real1000_offline_prefilter.py \
            experiments/r58_quality/test_r60_real1000_offline_prefilter.py \
            experiments/r58_quality/r60_real1000_prefilter_stage_crosswalk.py \
            experiments/r58_quality/test_r60_real1000_prefilter_stage_crosswalk.py \
            experiments/r58_quality/r60_real1000_deepseek_single.py \
            experiments/r58_quality/test_r60_real1000_deepseek_single.py \
            experiments/r58_quality/r60_real1000_v1_repair_plan.py \
            experiments/r58_quality/test_r60_real1000_v1_repair_plan.py
      - name: Offline synthetic-only paired reviewer regression
        run: |
          python -m pytest -q \
            experiments/r58_quality/test_r60_real_ai_dual_review.py \
            experiments/r58_quality/test_r60_real_quality_batch.py \
            experiments/r58_quality/test_r60_pilot5_v2_safe_audit.py \
            experiments/r58_quality/test_r60_pilot5_v2_replay_plan.py \
            experiments/r58_quality/test_r60_pilot5_v2_replay_execute.py \
            experiments/r58_quality/test_r60_pilot5_v2_crosswalk.py \
            tests/test_r60_real1000_screening_policy.py \
            experiments/r58_quality/r60_real1000_offline_prefilter.py \
            experiments/r58_quality/test_r60_real1000_offline_prefilter.py \
            experiments/r58_quality/r60_real1000_prefilter_stage_crosswalk.py \
            experiments/r58_quality/test_r60_real1000_prefilter_stage_crosswalk.py \
            experiments/r58_quality/test_r60_real1000_deepseek_single.py \
            experiments/r58_quality/test_r60_real1000_v1_repair_plan.py
