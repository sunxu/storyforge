name: R51 Gold195 Source Inventory (no GPU)

on:
  push:
    branches:
      - audit/r51-gold195-admission-20261019
    paths:
      - '.github/workflows/v03-r51-gold195-source-inventory.yml'
      - 'scripts/v03_r51_*.py'
      - 'tests/test_v03_r51_*.py'
      - 'evaluations/v0.2/gold-quality-87/gold_quality_accepted_87.jsonl'
      - 'evaluations/v0.2/gold-quality-108/gold_quality_accepted_108.jsonl'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Synthetic R51 schema and fail-closed tests
        run: |
          python3 -m unittest discover -s tests -p 'test_v03_r51_gold195_source_inventory.py' -v
      - name: Check original Gold108 schema keys ONLY (no data values)
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for cohort in ("87", "108"):
              root = Path(f"evaluations/v0.2/gold-quality-{cohort}")
              name = f"gold_quality_accepted_{cohort}.jsonl"
              with (root / name).open(encoding="utf8") as f:
                  entry = json.loads(f.readline())
              meta = entry.get("metadata")
              print(f"R51_SCHEMA_{cohort}_TOP_KEYS=",
                    sorted(k for k in entry if k.isascii()))
              print(f"R51_SCHEMA_{cohort}_METADATA_KEYS=",
                    sorted(k for k in meta if k.isascii()) if isinstance(meta, dict) else "MISSING")
          PY
      - name: Audit real 195 frozen Gold candidates without raw output
        run: |
          python3 scripts/v03_r51_gold195_source_inventory.py --repo .
