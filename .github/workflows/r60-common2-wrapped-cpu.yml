name: R60 Common2 Wrapped HF CPU (synthetic only)

on:
  push:
    branches:
      - r60/common2-cpu2-owner
    paths:
      - 'scripts/r60_common2_wrapped_hf_*'
      - 'scripts/r60_common2_wrapped_system_cpu_audit.py'
      - 'scripts/r60_common2_generic_system_wrapper_preview_cpu.py'
      - 'requirements/r60-common2-wrapped-cpu.in'
      - 'tests/test_r60_common2_wrapped_hf_pipeline.py'
      - 'skills/storyforge-hf-jobs/**'
      - 'skills/storyforge-roleplay-sft/**'
      - '.github/workflows/r60-common2-wrapped-cpu.yml'
  workflow_dispatch:

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 12
    env:
      PYTHONPATH: "src:scripts:experiments/r58_quality"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test and lint tooling (no model/Hub dependencies)
        run: python -m pip install pytest ruff
      - name: Syntax and shell safety
        run: |
          python -m compileall -q scripts/r60_common2_wrapped_hf_stage.py scripts/r60_common2_wrapped_hf_worker.py scripts/r60_common2_wrapped_hf_cli.py scripts/r60_common2_wrapped_hf_receipt_verify.py
          bash -n scripts/r60_common2_wrapped_hf_worker.sh
      - name: Ruff new pipeline code
        run: |
          ruff check scripts/r60_common2_wrapped_hf_stage.py scripts/r60_common2_wrapped_hf_worker.py scripts/r60_common2_wrapped_hf_cli.py scripts/r60_common2_wrapped_hf_receipt_verify.py tests/test_r60_common2_wrapped_hf_pipeline.py
      - name: Synthetic stage, CLI, receipt, CPU wrapper and shared runtime tests
        run: |
          python -m pytest -q tests/test_r60_common2_wrapped_hf_pipeline.py tests/test_r60_common2_wrapped_system_cpu_audit.py tests/test_hf_runtime.py tests/test_hf_runtime_volume_edges.py
      - name: Zero HF submissions and model downloads
        run: |
          echo "R60_WRAPPED_HF_CPU_SYNTHETIC_ONLY__NO_JOB__TRAIN_ADMITTED_0"
