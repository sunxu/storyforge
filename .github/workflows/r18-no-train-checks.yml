name: R18 no-train checks
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v02_r18_hf_no_train.py'
      - 'tests/test_v02_r18_hf_no_train.py'
      - '.github/workflows/r18-no-train-checks.yml'
  pull_request:
    paths:
      - 'scripts/v02_r18_hf_no_train.py'
      - 'tests/test_v02_r18_hf_no_train.py'
      - '.github/workflows/r18-no-train-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: python -m pip install 'ruff==0.17.0'
      - name: Lint only R18 files
        run: ruff check scripts/v02_r18_hf_no_train.py tests/test_v02_r18_hf_no_train.py
      - name: Offline R18 fail-closed tests
        run: python -m unittest discover -s tests -p test_v02_r18_hf_no_train.py -v
