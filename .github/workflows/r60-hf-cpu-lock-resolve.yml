name: R60 HF CPU tokenizer dependency lock

on:
  push:
    branches: [r60/hf-jobs-runtime]
    paths:
      - 'requirements/hf-cpu-tokenizer.in'
      - '.github/workflows/r60-hf-cpu-lock-resolve.yml'
  pull_request:
    paths:
      - 'requirements/hf-cpu-tokenizer.in'
      - '.github/workflows/r60-hf-cpu-lock-resolve.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned lock compiler
        run: |
          python -m pip install 'pip==24.3.1'
          python -m pip install 'pip-tools==7.5.0'
      - name: Resolve hash-pinned CPU tokenizer lock
        run: |
          pip-compile \
            --resolver=backtracking \
            --generate-hashes \
            --no-emit-index-url \
            --output-file=/tmp/hf-cpu-tokenizer.lock \
            requirements/hf-cpu-tokenizer.in
      - name: Verify locked installation and CPU-only dependency boundary
        run: |
          python -m pip install --require-hashes -r /tmp/hf-cpu-tokenizer.lock
          python -m pip check
          python - <<'PY'
          import importlib.util
          import jinja2
          import tokenizers
          import transformers
          import huggingface_hub
          assert importlib.util.find_spec("torch") is None
          print({
              "python": __import__("platform").python_version(),
              "transformers": transformers.__version__,
              "tokenizers": tokenizers.__version__,
              "huggingface_hub": huggingface_hub.__version__,
              "jinja2": jinja2.__version__,
              "torch_installed": False,
          })
          PY
      - name: Print generated lock for reviewed source-control capture
        run: cat /tmp/hf-cpu-tokenizer.lock
