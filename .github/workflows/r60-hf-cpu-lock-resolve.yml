name: R60 HF CPU tokenizer dependency lock

on:
  push:
    branches: [r60/hf-jobs-runtime]
    paths:
      - 'requirements/hf-cpu-tokenizer.in'
      - 'requirements/hf-cpu-tokenizer.lock'
      - 'requirements/hf-quality-reviewer.in'
      - 'requirements/README.md'
      - '.github/workflows/r60-hf-cpu-lock-resolve.yml'
  pull_request:
    paths:
      - 'requirements/hf-cpu-tokenizer.in'
      - 'requirements/hf-cpu-tokenizer.lock'
      - 'requirements/hf-quality-reviewer.in'
      - 'requirements/README.md'
      - '.github/workflows/r60-hf-cpu-lock-resolve.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned lock compiler
        run: |
          python -m pip install 'pip==24.3.1'
          python -m pip install 'pip-tools==7.5.0'
      - name: Resolve hash-pinned CPU tokenizer lock
        env:
          PIP_NO_INDEX: "false"
          PIP_INDEX_URL: "https://pypi.org/simple"
        run: |
          pip-compile \
            --resolver=backtracking \
            --generate-hashes \
            --index-url=https://pypi.org/simple \
            --no-emit-index-url \
            --output-file=/tmp/hf-cpu-tokenizer.lock \
            requirements/hf-cpu-tokenizer.in
      - name: Verify committed lock matches generated resolution
        run: |
          python - <<'PY'
          from pathlib import Path
          def normalized(path):
              return [line.rstrip() for line in Path(path).read_text().splitlines()
                      if line.strip() and not line.lstrip().startswith("#")]
          assert normalized("/tmp/hf-cpu-tokenizer.lock") == normalized("requirements/hf-cpu-tokenizer.lock")
          print("Committed lock matches hash-pinned resolution: PASS")
          PY
      - name: Verify committed locked installation and CPU-only dependency boundary
        run: |
          python -m pip install --no-cache-dir --require-hashes -r requirements/hf-cpu-tokenizer.lock
          python -m pip check
          python - <<'PY'
          import importlib.util
          import jinja2
          import tokenizers
          import transformers
          import huggingface_hub
          assert importlib.util.find_spec("torch") is None
          print({
              "python": __import__("platform").python_version(),
              "transformers": transformers.__version__,
              "tokenizers": tokenizers.__version__,
              "huggingface_hub": huggingface_hub.__version__,
              "jinja2": jinja2.__version__,
              "torch_installed": False,
          })
          PY
      - name: Verify R60 reviewer Chat Template dependency baseline
        run: |
          python -m venv /tmp/hf-reviewer-venv
          /tmp/hf-reviewer-venv/bin/python -m pip install --no-cache-dir -r requirements/hf-quality-reviewer.in
          /tmp/hf-reviewer-venv/bin/python -m pip check
          /tmp/hf-reviewer-venv/bin/python - <<'PY'
          import jinja2
          import sentencepiece
          import transformers
          from tokenizers import Tokenizer, models, pre_tokenizers
          from transformers import PreTrainedTokenizerFast

          assert transformers.__version__ == "4.57.1"
          assert sentencepiece.__version__ == "0.2.1"
          assert jinja2.__version__ == "3.1.6"

          backend = Tokenizer(models.WordLevel(
              {"[UNK]": 0, "hello": 1, "world": 2}, unk_token="[UNK]"
          ))
          backend.pre_tokenizer = pre_tokenizers.Whitespace()
          tokenizer = PreTrainedTokenizerFast(
              tokenizer_object=backend, unk_token="[UNK]"
          )
          tokenizer.chat_template = (
              "{% for message in messages %}"
              "{{ message['role'] }}: {{ message['content'] }}\\n"
              "{% endfor %}"
          )
          rendered = tokenizer.apply_chat_template(
              [{"role": "user", "content": "hello world"}],
              tokenize=False,
          )
          assert "user: hello world" in rendered
          print({
              "transformers": transformers.__version__,
              "sentencepiece": sentencepiece.__version__,
              "jinja2": jinja2.__version__,
              "chat_template_smoke": "PASS",
          })
          PY
      - name: Record lock digest
        run: sha256sum requirements/hf-cpu-tokenizer.lock
