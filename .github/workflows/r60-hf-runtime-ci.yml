name: R60 HF Runtime CI

on:
  push:
    branches: [r60/hf-jobs-runtime]
    paths:
      - 'src/storyforge_dataset/hf_runtime/**'
      - 'tests/test_hf_runtime.py'
      - 'tests/test_hf_runtime_volume_edges.py'
      - 'tests/test_token_preflight_core.py'
      - 'experiments/r60_hf_runtime/**'
      - 'tests/test_r60_cpu_volume_smoke.py'
      - 'tests/test_r60_hf_skill_contract.py'
      - 'experiments/r58_quality/r59_semantic_prompt_token_cpu.py'
      - 'experiments/r58_quality/test_r59_semantic_prompt_token_cpu.py'
      - 'skills/storyforge-hf-jobs/**'
      - 'docs/standards/HF_JOBS_ENGINEERING.md'
      - 'docs/R59_PILOT8_ADAPTER_RUNBOOK_CN.md'
      - '.github/workflows/r60-hf-runtime-ci.yml'
  pull_request:
    paths:
      - 'src/storyforge_dataset/hf_runtime/**'
      - 'tests/test_hf_runtime.py'
      - 'tests/test_hf_runtime_volume_edges.py'
      - 'tests/test_token_preflight_core.py'
      - 'experiments/r60_hf_runtime/**'
      - 'tests/test_r60_cpu_volume_smoke.py'
      - '.github/workflows/r60-hf-runtime-ci.yml'
      - 'docs/standards/R60_HF_JOBS_RUNTIME_ARCHITECTURE_V1_CN.md'

permissions:
  contents: read

jobs:
  runtime-quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and test tools
        run: |
          python -m pip install 'setuptools==80.9.0' 'pytest==8.4.2' 'ruff==0.14.3'
          python -m pip install -e . --no-build-isolation
      - name: Runtime lint
        run: ruff check src/storyforge_dataset/hf_runtime tests/test_hf_runtime.py tests/test_hf_runtime_volume_edges.py experiments/r60_hf_runtime/r60_cpu_smoke.py tests/test_r60_cpu_volume_smoke.py tests/test_r60_hf_skill_contract.py experiments/r58_quality/r59_semantic_prompt_token_cpu.py experiments/r58_quality/test_r59_semantic_prompt_token_cpu.py
      - name: Python compile
        run: python -m compileall -q src/storyforge_dataset/hf_runtime tests/test_hf_runtime.py tests/test_hf_runtime_volume_edges.py experiments/r60_hf_runtime/r60_cpu_smoke.py tests/test_r60_cpu_volume_smoke.py tests/test_r60_hf_skill_contract.py experiments/r58_quality/r59_semantic_prompt_token_cpu.py experiments/r58_quality/test_r59_semantic_prompt_token_cpu.py
      - name: Runtime synthetic tests
        run: pytest -q tests/test_hf_runtime.py tests/test_hf_runtime_volume_edges.py
      - name: R60 CPU volume smoke adapter tests
        run: pytest -q tests/test_r60_cpu_volume_smoke.py
      - name: R60 Skill contract tests
        run: pytest -q tests/test_r60_hf_skill_contract.py
      - name: R59 Pilot8 adapter regression (synthetic only)
        run: PYTHONPATH=experiments/r58_quality python -m unittest discover -s experiments/r58_quality -p 'test_r59_semantic_prompt_token_cpu.py' -q
      - name: Shared token preflight regression (unchanged source)
        run: python -m unittest discover -s tests -p 'test_token_preflight_core.py' -q
      - name: Verify no training or network dependencies in Runtime package
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('src/storyforge_dataset/hf_runtime')
          forbidden = ('import torch', 'from torch', 'import transformers',
                       'from transformers', 'import ms_swift', 'from ms_swift',
                       'import huggingface_hub', 'from huggingface_hub',
                       'import requests', 'from requests', 'import httpx', 'from httpx')
          for path in root.glob('*.py'):
              source = path.read_text(encoding='utf-8')
              for marker in forbidden:
                  if marker in source:
                      raise SystemExit(f'forbidden runtime dependency marker: {path.name}')
          print('Runtime dependency boundary: PASS')
          PY
