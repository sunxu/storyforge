[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storyforge"
version = "0.1.0"
description = "Dataset compiler and training pipeline for interactive narrative language models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "sunxu" }]
dependencies = []

[project.optional-dependencies]
analysis = ["transformers>=4.57", "tokenizers>=0.22", "huggingface-hub>=0.35"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
storyforge-dataset = "storyforge_dataset.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
